name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install curl + python3
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3

      # Enforce the same quality gates as CI for the crates you publish.
      - name: Rust fmt check (published crates)
        run: cargo fmt --all -- --check

      - name: Rust clippy (published crates)
        run: |
          cargo clippy \
            -p dig-dns-discovery \
            -p chia-generator-parser \
            -p chia-block-listener \
            --all-targets \
            -- -D warnings

      - name: Cargo login
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo login "$CARGO_REGISTRY_TOKEN"

      # Publish bottom-up: each crate depends only on the ones published before it.
      # publish-crate.sh does not return until crates.io actually serves the version it
      # uploaded, so the next crate's `cargo publish` can always resolve it from the
      # index. That replaces the separate visibility-wait step this job used to have,
      # which polled crates.io without a User-Agent, could therefore only ever see a
      # 403, and so timed out on every release — leaving the last crate unpublished.
      - name: Publish dig-dns-discovery
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crate.sh dig-dns-discovery

      - name: Publish chia-generator-parser
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crate.sh chia-generator-parser

      - name: Publish chia-block-listener
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crate.sh chia-block-listener

  build:
    name: Build binaries (${{ matrix.os }})
    needs: publish-crates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install @napi-rs/cli
        run: yarn global add @napi-rs/cli@^2.18.4

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Build artifacts
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ runner.os }}
          path: |
            ./*.node
            npm/**/package.json
            npm/**/*.node

  publish:
    name: Publish to npm
    needs: [ publish-crates, build ]
    runs-on: ubuntu-22.04
    # A job-level `permissions` block REPLACES the workflow-level one, so `contents: read`
    # is restated here for the checkout. `id-token: write` mints the OIDC token npm
    # exchanges for a short-lived publish credential (trusted publishing).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # `registry-url` is deliberately omitted: it makes setup-node write an .npmrc
      # containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With the token
      # gone that header expands to empty, and an empty-but-present auth header can take
      # precedence over OIDC and fail the publish. No .npmrc at all is the safe state.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install deps
        run: yarn install --frozen-lockfile

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm. The version is
      # echoed so a future silent downgrade shows up in the log instead of as a mystery
      # auth failure. This also covers the per-platform packages: `prepublishOnly` runs
      # `napi prepublish`, which shells out to `npm publish` in each npm/<triple>/ dir and
      # therefore uses this same global npm.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # No NODE_AUTH_TOKEN, and no .npmrc: the credential is the OIDC token minted from
      # `id-token: write`. The .npmrc is printed to prove no auth header survives — it
      # holds no secret now that the token is gone.
      - name: Publish main npm package
        run: |
          echo "--- ~/.npmrc ---"; cat ~/.npmrc 2>/dev/null || echo "(absent)"
          echo "--- ./.npmrc ---"; cat .npmrc 2>/dev/null || echo "(absent)"
          npm publish --access public