[package]
name = "chia-block-listener"
version = "0.5.1"
edition = "2021"
description = "Event driven listener and messaging interface for Chia blockchain peers"
license = "Apache-2.0" # or "MIT" / "MIT OR Apache-2.0" etc.

[dependencies]

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-util = "0.7"

# Chia-related dependencies
chia-protocol = "0.36.1"
chia-traits = "0.36.1"
# chia-ssl's ceiling is 0.42.1, NOT 0.36.1 — it is the one chia-* family whose version the
# wallet SDK pins ABOVE the 0.36 line the primitives sit on. The families are not uniform, so
# "match chia-protocol" is the wrong rule here; dig-peer-protocol (0.42.1) and chia-query (0.42)
# already declare it at this line, which is what makes 0.42.1 the ecosystem-consistent answer.
chia-ssl = "0.42.1"

# Networking
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = { version = "0.2", features = ["vendored"] }

# Serialization
serde = { version = "1", features = ["derive"] }
hex = "0.4"

# Utilities
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
dirs = "5"
dig-dns-discovery = { workspace = true }
chia-generator-parser = { workspace = true}

[dev-dependencies]
# Live-mainnet tests cross-check this crate against api.coinset.org, an anchor
# outside the crate under test. Test-only: consumers never pull an HTTP client.
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
# A `FullBlock` has ~12 nested required fields, so tests build one through its
# `Arbitrary` impl rather than hand-assembling a fixture that proves nothing.
arbitrary = "1"
chia-protocol = { version = "0.36.1", features = ["arbitrary"] }
# Pins the shipped Chia CA trust anchor by digest (tests/chia_ca_anchor.rs). Test-only: consumers
# never pull a hash implementation for this.
sha2 = "0.10"

[profile.release]
lto = true

[workspace]
members = [
    ".",
    "crate/chia-generator-parser",
    "crate/dig-dns-discovery",
    "crate/chia-block-listener-napi",
]

[workspace.dependencies]
dig-dns-discovery = { path = "crate/dig-dns-discovery", version = "0.4.2" }
chia-generator-parser = { path = "crate/chia-generator-parser", version = "0.4.2" }